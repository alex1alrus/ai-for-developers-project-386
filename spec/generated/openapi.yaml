openapi: 3.1.0
info:
  title: Call booking API
  version: 0.0.0
tags:
  - name: EventTypes
paths:
  /api/event-types:
    get:
      operationId: listEventTypes
      description: All event types sorted by title.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - EventTypes
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          description: English text for developers; the UI builds user text from `code`.
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_START
        - EVENT_TYPE_NOT_FOUND
        - EVENT_TYPE_EXISTS
        - BOOKING_CONFLICT
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Short identifier set by the owner, used in URLs.
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(.*\S)?$
          description: No surrounding whitespace, no line breaks.
        description:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 540
          description: Multiple of 15, from 15 to 540.
          multipleOf: 15
      description: A call format the owner offers.
